version: '3.8'

services:
  # The Kafka topic initializer service.
  # It waits for Kafka to be healthy and then creates the necessary topics.
  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      kafka1:
        condition: service_healthy
    entrypoint: >
      bash -c "
        # Wait until Kafka is ready, using the bootstrap-server defined in our Kafka service
        cub kafka-ready -b kafka1:19092 1 20 &&
        
        # Create user.login topic
        kafka-topics --create --if-not-exists \
        --topic user.login \
        --bootstrap-server kafka1:19092 \
        --partitions 1 --replication-factor 1 &&

        # Create rec.request topic
        kafka-topics --create --if-not-exists \
        --topic rec.request \
        --bootstrap-server kafka1:19092 \
        --partitions 1 --replication-factor 1 &&
        
        # Create llm.raw topic
        kafka-topics --create --if-not-exists \
        --topic llm.raw \
        --bootstrap-server kafka1:19092 \
        --partitions 1 --replication-factor 1 &&
        
        # Create rec.ready topic
        kafka-topics --create --if-not-exists \
        --topic rec.ready \
        --bootstrap-server kafka1:19092 \
        --partitions 1 --replication-factor 1
      "
    networks:
      - app-network

  # The AUTH service
  auth-service:
    build:
      context: .
      dockerfile: ./services/auth-service/Dockerfile
    image: genaimediarecommendation-auth-service:latest
    ports:
      - "8003:8003"
    volumes:
      - ./services/auth-service:/app
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=media_recs
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - KAFKA_BOOTSTRAP_SERVERS=kafka1:19092
    depends_on:
      postgres:
        condition: service_healthy
      kafka1:
        condition: service_healthy
    networks:
      - app-network

  # The LLM service
  llm-service:
    build:
      context: . # Set context to the project root
      dockerfile: ./services/llm-service/Dockerfile # Reference the specific Dockerfile
    image: genaimediarecommendation-llm-service:latest
    ports:
      - "8001:8001"
    volumes:
      - ./services/llm-service:/app
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka1:19092
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=media_recs
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ENV=local
    depends_on:
      kafka1:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  # The embedding service
  embedding-service:
    build:
      context: . # Set context to the project root
      dockerfile: ./services/embedding-service/Dockerfile # Reference the specific Dockerfile
    image: genaimediarecommendation-embedding-service:latest
    ports:
      - "8002:8002"
    volumes:
      - ./services/embedding-service:/app
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=media_recs
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  # The frontend
  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    image: genaimediarecommendation-frontend:latest
    ports:
      - "3000:80"
    depends_on:
      - auth-service
    networks:
      - app-network

  # The PostgreSQL database service with pgvector extension
  postgres:
    # Use the official pgvector image with a specific PostgreSQL version
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_DB: media_recs
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - ./init-pgvector.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./init-users.sql:/docker-entrypoint-initdb.d/02-users.sql
    healthcheck:
      # Use the pg_isready command to check database status.
      # It connects to the specified host and port and checks if the server is ready.
      # -U specifies the user, which is needed to authenticate the connection check.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app-network

  # The Redis caching service
  redis:
    image: redis:7
    healthcheck:
      # Use the Redis CLI to send a PING command.
      # The health check passes if the server responds with a "PONG".
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - app-network

  # The main Kafka broker service
  kafka1:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka1
    hostname: kafka1
    ports:
      - "9092:9092"
      - "19092:19092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Defines listeners with names for internal and external access
      KAFKA_LISTENERS: PLAINTEXT_INTERNAL://0.0.0.0:19092,PLAINTEXT_EXTERNAL://0.0.0.0:9092
      # Advertises the correct hostname/IP for each listener
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_INTERNAL://kafka1:19092,PLAINTEXT_EXTERNAL://localhost:9092
      # Maps listener names to their security protocol
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT_INTERNAL:PLAINTEXT,PLAINTEXT_EXTERNAL:PLAINTEXT
      # Specifies which listener other brokers will use
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - ./data/kafka1:/var/lib/kafka/data
    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server=kafka1:19092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - app-network

  # The Zookeeper service for Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - ./data/zookeeper:/var/lib/zookeeper
    healthcheck:
      test: ["CMD-SHELL", "echo 'ruok' | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
